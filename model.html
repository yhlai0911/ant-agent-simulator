<style>
:root{--bg:#071019;--panel:#0d1a25;--panel2:#102331;--line:#24404e;--text:#edf6fb;--muted:#a9bec8;--mint:#82e4d1;--blue:#8bc8ff;--amber:#ffd27d;--red:#ff9ca8;--shadow:0 16px 42px rgba(0,0,0,.28)}

main{max-width:1120px;margin:auto;padding:2.4rem 1rem 5rem}.hero{padding:3rem 2.2rem;border:1px solid var(--line);border-radius:1.4rem;background:linear-gradient(135deg,rgba(18,48,68,.96),rgba(10,25,35,.94));box-shadow:var(--shadow)}.eyebrow{letter-spacing:.18em;font-size:.78rem;font-weight:850;color:var(--mint);margin:0 0 .6rem}.hero h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1.1;margin:.2rem 0 1rem}.lead{max-width:54rem;color:#c5d7df;font-size:1.05rem}.badges{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.25rem}.badge,.tag{display:inline-flex;padding:.28rem .6rem;border-radius:999px;font-size:.78rem;font-weight:800}.badge.good,.tag.a{background:rgba(130,228,209,.16);color:var(--mint);border:1px solid rgba(130,228,209,.38)}.badge.method,.tag.b{background:rgba(139,200,255,.14);color:var(--blue);border:1px solid rgba(139,200,255,.35)}.badge.warn,.tag.c{background:rgba(255,210,125,.13);color:var(--amber);border:1px solid rgba(255,210,125,.36)}
.notice,.card,.equation-card{margin-top:1rem;border:1px solid var(--line);border-radius:1.1rem;background:rgba(13,26,37,.94);box-shadow:var(--shadow)}.notice{padding:1rem 1.15rem;border-color:rgba(255,210,125,.42);background:rgba(71,49,20,.32);color:#ffe7b7}.card,.equation-card{padding:1.35rem}.card h2,.equation-card h2{margin:.1rem 0 .75rem}.legend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}.legend-grid>div{padding:1rem;background:var(--panel2);border-radius:.85rem}.legend-grid p{margin:.4rem 0 0;color:var(--muted);font-size:.9rem}

.eq{overflow-x:auto;overflow-y:hidden;margin:.7rem 0;padding:1rem;border-radius:.8rem;border:1px solid #315363;background:#061018;color:#f7fcff;font-size:clamp(.84rem,2vw,1.02rem);line-height:1.65;text-align:center;scrollbar-width:thin}.eq.small{font-size:clamp(.76rem,1.8vw,.94rem)}.eq .katex-display{margin:0;min-width:max-content}.eq .katex{font-size:1.08em}.eq.small .katex{font-size:1em}.math-fallback .eq{font-family:"SFMono-Regular",Consolas,monospace}.math-render-note{margin:.8rem 0 0;color:var(--muted);font-size:.82rem}
.caveat{padding:.8rem 1rem;border-left:3px solid var(--amber);background:rgba(255,210,125,.07);color:#ffe4ae}.state-flow{text-align:center;padding:1rem;background:var(--panel2);border-radius:.8rem}.state-flow span{display:inline-block;padding:.35rem .65rem;margin:.2rem;border-radius:.55rem;background:#183747}.state-flow b{color:var(--mint)}.rule-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.65rem}.rule-grid div{display:flex;flex-direction:column;padding:.8rem;background:var(--panel2);border-radius:.8rem}.rule-grid span{color:var(--muted)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:.75rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mint);font-size:.84rem;letter-spacing:.04em}td{color:#d8e6ec}.yes{color:var(--mint)}.maybe{color:var(--amber)}.no{color:var(--red)}.steps{padding-left:1.5rem}.steps li{margin:.65rem 0;padding-left:.35rem}.callout{padding:1rem;border-radius:.8rem;background:#132b39;border:1px solid #315363}.references ol{padding-left:1.4rem}.references li{margin:.8rem 0;color:#d1e0e6}.references a{color:var(--blue);overflow-wrap:anywhere}.muted{color:var(--muted)}footer{margin-top:2rem;text-align:center;color:var(--muted);font-size:.88rem}.loading{padding:5rem 1rem;text-align:center;color:var(--muted)}
